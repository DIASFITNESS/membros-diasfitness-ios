workflows:
  ios-members:
    name: Membros Diasfitness iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      xcode: latest
      cocoapods: default

      groups:
        - credenciais_da_loja_de_aplicativos

      vars:
        BUNDLE_ID: "com.diasfitness.reader"
        XCODE_WORKSPACE: "src/Membros Diasfitness.xcworkspace"
        XCODE_SCHEME: "Membros Diasfitness"

    scripts:
      - name: Instalar dependências CocoaPods
        script: |
          cd "$CM_BUILD_DIR/src"
          pod install

      - name: Inicializar keychain
        script: |
          keychain initialize

      - name: Buscar ou criar assinatura Apple
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Adicionar certificados ao keychain
        script: |
          keychain add-certificates

      - name: Configurar assinatura do projeto
        script: |
          xcode-project use-profiles

      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
